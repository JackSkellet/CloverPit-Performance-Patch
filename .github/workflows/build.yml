name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - name: Algorithm and opacity tests
        run: dotnet run --project tests/AlgorithmTests -c Release
      - name: Build standalone installer
        run: dotnet publish src/Installer/Installer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o artifacts/publish
      - name: Installer smoke check
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { './artifacts/publish/CloverPitPatch.exe' } else { './artifacts/publish/CloverPitPatch' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help check failed' }
          & $exe install ./not-a-game
          if ($LASTEXITCODE -eq 0) { throw 'Invalid game directory was accepted' }
          exit 0
      - name: Package release
        run: python scripts/package_release.py ${{ matrix.rid }} artifacts/publish artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-${{ matrix.rid }}
          path: artifacts/packages/*
          if-no-files-found: error
